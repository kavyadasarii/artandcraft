<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — ArtCraft Supply Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="auth.css">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body>

<div class="utility-bar">
  <button type="button" id="dirToggle" class="utility-btn" aria-label="Switch to right-to-left">
    <i class="fa-solid fa-arrow-right-arrow-left"></i>
  </button>
  <button type="button" id="themeToggle" class="utility-btn" aria-label="Switch to dark mode">
    <i class="fa-solid fa-moon icon-moon"></i>
    <i class="fa-solid fa-sun icon-sun"></i>
  </button>
</div>

<div class="auth-shell">
  <div class="auth-card">

    <a href="../index.html" class="auth-logo">
      <span class="mark"><i class="fa-solid fa-palette"></i></span>
      <span class="logo-text">
        <span class="name">Art<span>Craft</span></span>
        <span class="sub">SUPPLY STUDIO</span>
      </span>
    </a>

    <h1>Welcome Back</h1>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <div class="input-wrap">
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input class="has-toggle" type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-visibility" aria-label="Show password" data-target="password"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>

      <div class="field-meta">
        <label class="checkbox-row">
          <input type="checkbox">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-submit"><i class="fa-solid fa-palette"></i> Log In</button>
    </form>

    <div class="divider">or log in with</div>

    <div class="social-row">
      <button type="button" class="social-btn google"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" class="social-btn apple"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>

    <p class="auth-footer-note">New here? <a href="signup.html">Create an account</a></p>

  </div>
</div>

<script src="auth.js"></script>

</body>
</html>
